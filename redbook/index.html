<style>
@font-face{font-family:"EB Garamond";font-weight:400;font-style:normal;font-display:swap;src:url(/redbook/fonts/ebg-400.woff2) format("woff2")}
@font-face{font-family:"EB Garamond";font-weight:400;font-style:italic;font-display:swap;src:url(/redbook/fonts/ebg-400i.woff2) format("woff2")}
@font-face{font-family:"EB Garamond";font-weight:500;font-style:normal;font-display:swap;src:url(/redbook/fonts/ebg-500.woff2) format("woff2")}
@font-face{font-family:"EB Garamond";font-weight:600;font-style:normal;font-display:swap;src:url(/redbook/fonts/ebg-600.woff2) format("woff2")}
@font-face{font-family:"Bebas Neue";font-weight:400;font-style:normal;font-display:swap;src:url(/redbook/fonts/bebas.woff2) format("woff2")}
:root{--paper:#FAF5EA;--ink:#241C17;--ink-soft:#4A3D33;--muted:#8C7765;--red:#A8261C;--cover:#A3211B;
  --cover-hi:#B92C22;--cover-lo:#841913;--gold:#E4C47F;--cream:#F6EAD3;--rule:#E3D6C4;
  --serif:"EB Garamond",Garamond,"Iowan Old Style",Georgia,serif;--display:"Bebas Neue","Oswald",Impact,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:18px;line-height:1.56;
  font-kerning:normal;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
@media (min-width:720px){body{font-size:19.5px}}
a{color:inherit}
::selection{background:rgba(168,38,28,.18)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* cover and gate */
.cover{position:relative;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:3.2rem 1.5rem;
  color:var(--cream);overflow:hidden;
  background:radial-gradient(ellipse at 30% 18%,var(--cover-hi) 0%,var(--cover) 50%,var(--cover-lo) 100%)}
.frame{position:absolute;inset:14px;border:1px solid var(--gold);border-radius:12px;pointer-events:none}
.frame::after{content:"";position:absolute;inset:5px;border:1px solid rgba(228,196,127,.42);border-radius:8px}
.cover-inner{position:relative;width:min(100%,44rem);text-align:center}
.cover .emblem{display:block;width:clamp(150px,44vw,210px);height:auto;margin:0 auto 2rem}
.t-small{margin:0;font-style:italic;color:var(--gold);font-size:clamp(1.35rem,5vw,1.75rem);line-height:1}
.t-big{margin:.5rem 0 0;font-family:var(--display);font-weight:400;font-size:clamp(3rem,14.5vw,5.3rem);
  line-height:.95;letter-spacing:.045em;color:var(--cream)}
.c-rule{width:3.2rem;height:1px;background:var(--gold);margin:1.4rem auto}
.c-sub{margin:0;font-style:italic;font-size:1.02rem;line-height:1.45}
.c-foot{margin:2.6rem 0 0;font-size:.6rem;letter-spacing:.32em;text-transform:uppercase;color:var(--gold)}
.gate{margin:2.3rem auto 0;max-width:21rem}
.gate-label{display:block;margin-bottom:.8rem;font-size:.62rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
.gate-row{display:flex;gap:.5rem}
.gate input[type=password]{flex:1;min-width:0;font:inherit;font-size:1.05rem;color:var(--cream);background:rgba(40,6,4,.2);
  border:1px solid rgba(228,196,127,.55);border-radius:9px;padding:.68rem .9rem;outline:none;transition:border-color .2s,box-shadow .2s}
.gate input[type=password]::placeholder{color:rgba(246,234,211,.6);font-style:italic}
.gate input[type=password]:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(228,196,127,.22)}
.gate button{font-family:var(--display);font-size:1.15rem;letter-spacing:.16em;color:var(--cover-lo);background:var(--gold);
  border:0;border-radius:9px;padding:.62rem 1.15rem .55rem;cursor:pointer;transition:background .2s}
.gate button:hover{background:#EED59B}
.gate button:focus-visible,.btn:focus-visible,.fab:focus-visible,.lock:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.gate.busy button{opacity:.7;cursor:progress}
.remember{display:inline-flex;align-items:center;gap:.45rem;margin-top:.95rem;font-size:.86rem;font-style:italic;
  color:rgba(246,234,211,.88);cursor:pointer}
.remember input{accent-color:var(--gold);width:1rem;height:1rem;margin:0}
.gate-msg{min-height:1.4em;margin:.7rem 0 0;font-size:.95rem;font-style:italic;color:var(--gold)}
.gate.shake{animation:shake .42s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.opened{display:none;margin-top:2.3rem;gap:.7rem;justify-content:center;flex-wrap:wrap}
body.unlocked .gate{display:none}
body.unlocked .opened{display:flex}
.btn{display:inline-block;font-family:var(--display);font-size:1.12rem;letter-spacing:.15em;text-decoration:none;
  border-radius:999px;padding:.62rem 1.3rem .55rem;transition:background .2s,color .2s}
.cover .btn.solid{background:var(--gold);color:var(--cover-lo)}
.cover .btn.solid:hover{background:#EED59B}
.cover .btn.ghost{border:1px solid rgba(228,196,127,.7);color:var(--gold)}
.cover .btn.ghost:hover{background:rgba(228,196,127,.12)}

/* reader */
main{padding:0 1.3rem 5rem}
main[hidden]{display:none}
body.unlocked main{animation:rise .7s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.contents,.part,.coda,.end{max-width:34rem;margin:0 auto}
.kicker{margin:0;text-align:center;font-family:var(--display);font-size:1.12rem;letter-spacing:.28em;color:var(--red)}
.contents{padding:4.6rem 0 0}
.toc{list-style:none;margin:2rem 0 0;padding:0}
.toc a{display:grid;grid-template-columns:3.3rem 1fr;align-items:baseline;padding:.46rem 0;border-bottom:1px solid var(--rule);
  color:var(--ink);text-decoration:none;line-height:1.3}
.toc li:first-child a{border-top:1px solid var(--rule)}
.toc .tn{font-family:var(--display);font-size:1.02rem;letter-spacing:.06em;color:var(--red)}
.toc .extra a{font-style:italic;color:var(--ink-soft)}
.toc a:hover .tt{color:var(--red)}
.part{padding-top:6.6rem;scroll-margin-top:.5rem}
.opener{margin-bottom:2.4rem;text-align:center}
.numeral{margin:0;font-family:var(--display);font-size:clamp(3.4rem,14vw,4.6rem);line-height:1;letter-spacing:.05em;color:var(--red)}
.opener .kicker{margin-bottom:.15rem}
.opener h2{margin:.65rem 0 0;font-size:clamp(1.55rem,5.6vw,2.05rem);font-weight:500;line-height:1.15;text-wrap:balance}
.after{margin:.5rem 0 0;font-size:.92rem;font-style:italic;color:var(--muted);text-wrap:balance}
.sun{display:block;width:2.9rem;height:auto;margin:1.15rem auto 0}
.sayings{list-style:none;margin:0;padding:0}
.sayings li{display:grid;grid-template-columns:2rem 1fr;margin:0 0 1.15rem}
.sn{padding-top:.3rem;font-size:.84rem;font-weight:600;color:var(--red);font-variant-numeric:lining-nums}
.sayings p{margin:0;hyphens:auto}
@media (min-width:760px){.sayings li{grid-template-columns:2.7rem 1fr;margin-left:-2.7rem}}
.lead{margin:0 0 1.7rem;text-align:center;font-style:italic;text-wrap:balance}
.subhead{margin:2.2rem 0 1.15rem;text-align:center;font-size:.72rem;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:var(--red)}
.prose p{margin:0 0 1.05rem;hyphens:auto}
.prose .lede{margin-bottom:1.7rem;text-align:center;font-size:1.16rem;font-style:italic;text-wrap:balance}
.dash{list-style:none;margin:0 0 1.15rem;padding:0 0 0 .4rem}
.dash li{position:relative;margin-bottom:.3rem;padding-left:1.3rem}
.dash li::before{content:"\2013";position:absolute;left:0;color:var(--red)}
.rules{margin-bottom:1.1rem}
strong{font-weight:600}
.prose a,.args a,.cite a{text-decoration:underline;text-decoration-color:#D9A79F;text-decoration-thickness:1px;text-underline-offset:3px}
.prose a:hover,.args a:hover,.cite a:hover{color:var(--red)}
.intro{margin:0 0 1.9rem;text-align:center;font-style:italic;text-wrap:balance}
.args p{margin:0 0 1.25rem;hyphens:auto}
.args strong{color:var(--red)}
.src-where{margin:1.8rem 0 .6rem;font-size:.68rem;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:var(--red)}
.cite{margin:0 0 1.05rem;font-size:.93rem;line-height:1.5}
.cite .url{display:block;margin-top:.15rem;font-size:.78rem;color:var(--muted);word-break:break-all}
.coda{padding:7.5rem 0 .5rem;text-align:center}
.coda .emblem{width:62px;height:62px}
.coda p{margin:1.6rem 0 0;font-size:1.28rem;font-style:italic;line-height:1.5}
.end{padding:5.5rem 0 0;text-align:center}
.end .btn.solid{background:var(--red);color:var(--cream)}
.end .btn.solid:hover{background:#8F1F17}
.colophon{margin:1.4rem 0 0;font-size:.85rem;font-style:italic;color:var(--muted)}
.lock{margin-top:1.4rem;font:inherit;font-size:.85rem;font-style:italic;color:var(--muted);background:none;border:0;
  text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.lock:hover{color:var(--red)}

/* contents button, sheet, progress */
.progress{position:fixed;top:0;left:0;z-index:30;width:100%;height:3px;background:var(--red);transform:scaleX(0);transform-origin:0 50%}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));z-index:20;
  font-family:var(--display);font-size:1rem;letter-spacing:.17em;color:var(--cream);background:var(--red);border:0;border-radius:999px;
  padding:.66rem 1.1rem .58rem;box-shadow:0 8px 24px rgba(90,20,10,.28);cursor:pointer;opacity:0;transform:translateY(12px);
  pointer-events:none;transition:opacity .25s,transform .25s}
body.reading .fab{opacity:1;transform:none;pointer-events:auto}
body.reading.fab-away .fab{opacity:0;transform:translateY(12px);pointer-events:none}
.sheet{width:min(92vw,30rem);max-height:82vh;padding:0;border:0;border-radius:16px;background:var(--paper);color:var(--ink);
  box-shadow:0 24px 70px rgba(30,10,5,.4)}
.sheet::backdrop{background:rgba(36,28,23,.5)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.25rem .5rem}
.sheet-head .kicker{text-align:left}
.sheet-close{font:inherit;font-size:1.6rem;line-height:1;color:var(--muted);background:none;border:0;cursor:pointer;padding:.2rem .4rem}
.sheet-body{max-height:calc(82vh - 3.6rem);overflow:auto;padding:0 1.25rem 1.25rem}
.sheet .toc{margin-top:.4rem}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
(() => {
  const P = JSON.parse(document.getElementById('payload').textContent);
  const STORE = 'redbook-key';
  const enc = new TextEncoder(), dec = new TextDecoder();
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const $ = id => document.getElementById(id);
  const form = $('gate'), pw = $('pw'), msg = $('msg'), remember = $('remember'), book = $('book');

  async function derive(pass) {
    const base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: unb64(P.salt), iterations: P.iter, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
  }
  async function open(key) {
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(P.iv) }, key, unb64(P.ct));
    return JSON.parse(dec.decode(plain));
  }
  function reveal(data) {
    book.innerHTML = data.html;
    book.hidden = false;
    const url = URL.createObjectURL(new Blob([unb64(data.pdf)], { type: 'application/pdf' }));
    document.querySelectorAll('[data-pdf]').forEach(a => {
      a.href = url; a.download = 'The-Teachers-Little-Red-Book.pdf';
    });
    $('sheet-body').replaceChildren(book.querySelector('.toc').cloneNode(true));
    document.body.classList.add('unlocked');
    watch();
    if (location.hash.length > 1) {
      const target = document.getElementById(decodeURIComponent(location.hash.slice(1)));
      if (target) requestAnimationFrame(() => target.scrollIntoView());
    }
  }
  function watch() {
    const cover = document.querySelector('.cover'), bar = document.querySelector('.progress span') || document.querySelector('.progress');
    new IntersectionObserver(([e]) => document.body.classList.toggle('reading', !e.isIntersecting), { threshold: 0.05 }).observe(cover);
    let ticking = false, lastY = scrollY;
    addEventListener('scroll', () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => {
        const y = scrollY, max = document.documentElement.scrollHeight - innerHeight;
        bar.style.transform = `scaleX(${max > 0 ? Math.min(1, y / max) : 0})`;
        // tuck the Contents button away while reading down, bring it back on any upward scroll
        if (y > lastY + 6 && max - y > 160) document.body.classList.add('fab-away');
        else if (y < lastY - 6 || max - y <= 160) document.body.classList.remove('fab-away');
        lastY = y;
        ticking = false;
      });
    }, { passive: true });
  }
  async function fromStore() {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(STORE) || 'null'); } catch (_) {}
    if (!saved || saved.salt !== P.salt) return;
    try {
      const key = await crypto.subtle.importKey('raw', unb64(saved.k), 'AES-GCM', true, ['decrypt']);
      reveal(await open(key));
    } catch (_) {
      try { localStorage.removeItem(STORE); } catch (__) {}
    }
  }

  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (!pw.value) return;
    if (!window.crypto || !crypto.subtle) { msg.textContent = 'This page needs a secure (https) connection.'; return; }
    form.classList.add('busy');
    msg.textContent = 'Opening…';
    let key, data;
    try {
      key = await derive(pw.value);
      data = await open(key);
    } catch (_) {
      form.classList.remove('busy');
      msg.textContent = 'That is not the password. Try again.';
      form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
      pw.select();
      return;
    }
    form.classList.remove('busy');
    if (remember.checked) {
      try { localStorage.setItem(STORE, JSON.stringify({ salt: P.salt, k: b64(await crypto.subtle.exportKey('raw', key)) })); } catch (_) {}
    }
    msg.textContent = '';
    pw.value = '';
    reveal(data);
  });

  const sheet = $('sheet');
  $('fab').addEventListener('click', () => sheet.showModal());
  $('sheet-close').addEventListener('click', () => sheet.close());
  sheet.addEventListener('click', e => { if (e.target === sheet || e.target.closest('a')) sheet.close(); });
  document.addEventListener('click', e => {
    if (e.target.closest('[data-lock]')) {
      try { localStorage.removeItem(STORE); } catch (_) {}
      location.replace(location.pathname);
    }
  });
  fromStore();
})();
</script>
