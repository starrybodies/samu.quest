<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <rect width="600" height="400" fill="#050505"/>
  <!-- terminal window -->
  <rect x="70" y="66" width="460" height="268" rx="10" fill="#0b0f12" stroke="#7dd3fc" stroke-opacity="0.18"/>
  <rect x="70" y="66" width="460" height="30" rx="10" fill="#0e151a"/>
  <rect x="70" y="86" width="460" height="10" fill="#0e151a"/>
  <circle cx="90" cy="81" r="4" fill="#7dd3fc" fill-opacity="0.55"/>
  <circle cx="106" cy="81" r="4" fill="#7dd3fc" fill-opacity="0.3"/>
  <circle cx="122" cy="81" r="4" fill="#7dd3fc" fill-opacity="0.15"/>
  <text x="300" y="85" fill="#4a5a63" font-size="11" text-anchor="middle" letter-spacing="1">samu@quest</text>
  <!-- code lines -->
  <g font-size="15" letter-spacing="0.5">
    <text x="92" y="132" fill="#4a5a63">$</text>
    <text x="112" y="132" fill="#e8f4fa">git commit -m</text>
    <text x="252" y="132" fill="#7dd3fc">"ship it"</text>
    <text x="92" y="164" fill="#4a5a63">&#8594;</text>
    <text x="112" y="164" fill="#8aa0aa">agents</text>
    <text x="192" y="164" fill="#e8f4fa">.deploy(</text>
    <text x="282" y="164" fill="#7dd3fc">planet</text>
    <text x="352" y="164" fill="#e8f4fa">)</text>
    <text x="92" y="196" fill="#4a5a63">$</text>
    <text x="112" y="196" fill="#e8f4fa">status:</text>
    <text x="192" y="196" fill="#4ade80">cracked</text>
    <text x="92" y="228" fill="#4a5a63">$</text>
    <rect x="112" y="217" width="13" height="17" fill="#7dd3fc"/>
  </g>
  <!-- footer label -->
  <text x="300" y="300" fill="#7dd3fc" fill-opacity="0.9" font-size="13" text-anchor="middle" letter-spacing="4">AGENTIC BUILDER</text>
</svg>
